analyzer:
  exclude:
    - build/**
    - web/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Os enums espelham os nomes do back-end (AZUL_FORTE, FIBRA_DE_VIDRO...).
    constant_identifier_names: false
    # O DropdownButtonFormField.value é o único jeito de refletir mudanças via setState em todas as versões do Flutter.
    deprecated_member_use: false
