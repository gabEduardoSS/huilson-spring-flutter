spring.application.name=demo

# ---- Banco de dados (mesmos valores que estavam fixos no JPAConexao do projeto antigo) ----
# Podem ser sobrescritos por variáveis de ambiente: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projeto-kotlin-flutter}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# "update" cria/ajusta tabelas e colunas que faltarem (útil em desenvolvimento).
# Para produção, prefira "validate" + migrações versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Regras da aplicação ----
# Saldo com que o caixa (id = 1) é criado se ainda não existir.
app.caixa.saldo-inicial=0
# Origens permitidas no CORS (separadas por vírgula). Só importa se o Flutter rodar como Web.
app.cors.allowed-origins=*
