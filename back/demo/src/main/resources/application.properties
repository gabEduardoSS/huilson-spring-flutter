spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/LoginPage
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.caixa.saldo-inicial=100000

# ---- Admin criado automaticamente na primeira subida (só se ainda não existir) ----
app.usuario.user = admin
# Senha do admin. Em produção defina a variável de ambiente ADMIN_PASSWORD (o valor depois de ":" é só para desenvolvimento).
app.usuario.password=${ADMIN_PASSWORD:admin123}

# ---- Token de login (ver TokenService) ----
# Segredo que ASSINA os tokens. Mínimo 32 caracteres. Em produção defina JWT_SECRET (o valor depois de ":" é só para desenvolvimento).
# Se este segredo vazar ou mudar, todos os tokens existentes deixam de valer (todo mundo precisa logar de novo).
app.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-0123456789}
# Quantas horas o login vale.
app.jwt.expiracao-horas= 30
# Tempo em minutos pro timer encerrar a seção. ele é multiplicado em MiliSegundos depois
app.sessao.inatividade-minutos=1

# Origens do Flutter Web permitidas no CORS (ver Beans.kt). "*" = qualquer uma; em produção coloque o endereço do front.
app.cors.allowed-origins=*

# ---- Log de auditoria ("quem acessou?") ----
# Mostra o usuário logado em TODA linha de log. O valor vem do MDC preenchido no TokenAuthFilter.
# Ex.: " INFO [ADMIN] GET /api/clientes -> 200". Sem login aparece [anonimo].
logging.pattern.level=%5p [%X{usuario:-anonimo}]
# Só necessário se o back ficar atrás de proxy/load balancer (para o IP do log ser o do cliente real).
# server.forward-headers-strategy=framework
